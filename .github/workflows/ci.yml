name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Host vocabulary stays out of the tree
        env:
          HOST_VOCABULARY: 'co-?writer|cowriter|song|lyric|cover[ _-]?image|album|musician|judge([^a-z]|$)|\b(bpm|key_scale|audio_duration|tempo|set_tempo|verse|chorus|rhyme|vers)\b'
        run: |
          allowed=.github/host-vocabulary-allowed.txt
          if grep -n -x '' "$allowed"; then
            echo "$allowed has an empty line, which would allow every hit"
            exit 1
          fi
          matches=$(git grep -n -i -E "$HOST_VOCABULARY" -- src packages tests docs) || [ $? -eq 1 ]
          hits=
          if [ -n "$matches" ]; then
            hits=$(printf '%s\n' "$matches" | grep -v -E -f "$allowed") || [ $? -eq 1 ]
          fi
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            exit 1
          fi

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # The workspace's own packages are put on the path rather than built, so
      # every checking step runs only locked wheels and no setup script.
      - name: Install dependencies
        run: uv sync --locked --all-packages --extra dev --extra image --no-build --no-install-workspace

      - name: Ruff
        env:
          PYTHONPATH: src:packages/agent-client/src:packages/agent-service/src
        run: uv run --locked --no-sync --no-build ruff check src tests packages

      - name: Import boundaries
        env:
          PYTHONPATH: src:packages/agent-client/src:packages/agent-service/src
        run: uv run --locked --no-sync --no-build lint-imports

      - name: Tests
        env:
          PYTHONPATH: src:packages/agent-client/src:packages/agent-service/src
        run: >-
          uv run --locked --no-sync --no-build pytest tests -q
          --cov=src --cov=packages/agent-client/src --cov=packages/agent-service/src
          --cov-report=xml:coverage.xml

      - name: Upload the coverage report for the quality gate
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

      - name: Build the three distributions
        run: uv build --all-packages

      - name: The client wheel carries the repository licence
        run: |
          licence="$(mktemp -d "$RUNNER_TEMP/client-licence.XXXXXX")"
          python3 -I -m zipfile -e dist/overnightworks_agent_client-*-py3-none-any.whl "$licence"
          cmp LICENSE "$licence"/overnightworks_agent_client-*.dist-info/licenses/LICENSE

      - name: The client wheel imports alone, outside the workspace
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/client-only.XXXXXX")"
          uv venv "$proof/venv"
          uv pip install --python "$proof/venv/bin/python" \
            "$GITHUB_WORKSPACE"/dist/overnightworks_agent_client-*-py3-none-any.whl
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import importlib
          import importlib.util
          import pkgutil

          import agent_client

          assert importlib.util.find_spec("agent_providers") is None, "core leaked in"
          for module in pkgutil.walk_packages(agent_client.__path__, "agent_client."):
              importlib.import_module(module.name)
              print("imported", module.name)
          '

      - name: Both wheels install together and the core imports dispatch
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/two-wheels.XXXXXX")"
          uv venv "$proof/venv"
          uv pip install --python "$proof/venv/bin/python" \
            "$GITHUB_WORKSPACE"/dist/overnightworks_agent_client-*-py3-none-any.whl \
            "$GITHUB_WORKSPACE"/dist/overnightworks_agent_providers-*-py3-none-any.whl
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import agent_client.tools
          import agent_providers.dispatch
          import agent_providers.tools

          assert agent_providers.tools.ToolDeclaration is agent_client.tools.ToolDeclaration
          print("imported", agent_providers.dispatch.__name__, "from", agent_providers.__file__)
          '
          printf 'from agent_providers.tools import ToolCatalog, ToolDeclaration\n' > consumer.py
          uvx pyright@1.1.414 --pythonpath "$proof/venv/bin/python" consumer.py

      - name: The three wheels install together and the service refuses a bad config
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/three-wheels.XXXXXX")"
          uv venv "$proof/venv"
          uv pip install --python "$proof/venv/bin/python" \
            "$GITHUB_WORKSPACE"/dist/overnightworks_agent_client-*-py3-none-any.whl \
            "$GITHUB_WORKSPACE"/dist/overnightworks_agent_providers-*-py3-none-any.whl \
            "$GITHUB_WORKSPACE"/dist/overnightworks_agent_service-*-py3-none-any.whl
          cd "$proof"
          "$proof/venv/bin/python" -I -c 'import agent_service.app; print("imported", agent_service.app.__name__)'
          "$proof/venv/bin/python" -I "$GITHUB_WORKSPACE/tests/wheel_smoke/app_tools_discovery.py"
          printf '[identity]\nissuer = "https://issuer.test"\n' > bad.toml
          status=0
          "$proof/venv/bin/agent-service" --config bad.toml 2> refused.txt || status=$?
          cat refused.txt
          test "$status" -eq 2
          grep -q 'identity.jwks_url' refused.txt

  checks:
    name: checks
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every Python minor passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  keycloak-token-shapes:
    name: keycloak-token-shapes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
      KEYCLOAK_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
          cache-dependency-glob: tests/keycloak/requirements.txt

      - name: Start Keycloak with the test realm
        run: |
          docker run --detach --name keycloak --publish 8080:8080 \
            --volume "$GITHUB_WORKSPACE/tests/keycloak:/opt/keycloak/data/import:ro" \
            "$KEYCLOAK_IMAGE" start-dev --import-realm

      - name: Install the job's hash-locked environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" \
            --require-hashes --no-build -r tests/keycloak/requirements.txt

      - name: Wait until the test realm is served
        run: |
          for attempt in $(seq 60); do
            if curl --fail --silent "$KEYCLOAK_URL/realms/agent-test/.well-known/openid-configuration" > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs keycloak
          exit 1

      - name: Token shapes
        run: >-
          "$RUNNER_TEMP/venv/bin/python" -m pytest --noconftest -p no:cacheprovider
          tests/test_keycloak_token_shapes.py -m keycloak -q -rP

      # The workspace's own packages are put on the path rather than built, so
      # this job runs no setup script: every installed package is a locked wheel.
      - name: Install the workspace's locked wheels for the service's end-to-end proof
        run: uv sync --locked --all-packages --extra dev --no-build --no-install-workspace

      - name: The service admits real Keycloak tokens end to end
        env:
          PYTHONPATH: src:packages/agent-client/src:packages/agent-service/src
        run: >-
          uv run --locked --no-sync --no-build pytest -p no:cacheprovider
          tests/test_service_keycloak.py -m keycloak -q -rP

      - name: Keycloak log on failure
        if: failure()
        run: docker logs keycloak

      - name: Stop Keycloak
        if: always()
        run: docker rm --force keycloak

  dependency-floors:
    name: dependency-floors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Install the lowest declared direct dependencies
        run: uv sync --all-packages --extra dev --extra image --no-build --no-install-workspace

      - name: Versions the suite runs against
        run: uv pip list

      - name: Tests
        env:
          PYTHONPATH: src:packages/agent-client/src:packages/agent-service/src
        run: uv run --no-sync --no-build pytest tests -q

  quality:
    needs: [checks, keycloak-token-shapes, dependency-floors]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@75467b7888ab8158dda370c770d3323dfc1f594e # v0.1.1
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
