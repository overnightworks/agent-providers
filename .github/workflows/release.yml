name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false

      - name: Build the three distributions
        run: uv build --all-packages

      - name: The tag names the version all three wheels were built at
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(printf '%s\n' \
            "overnightworks_agent_client-${version}-py3-none-any.whl" \
            "overnightworks_agent_providers-${version}-py3-none-any.whl" \
            "overnightworks_agent_service-${version}-py3-none-any.whl")"
          built="$(cd dist && ls -- *.whl | sort)"
          if [ "$built" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME expects exactly:" >&2
            echo "$expected" >&2
            echo "but the build produced:" >&2
            echo "$built" >&2
            exit 1
          fi

      - name: Point a breaking release at its migration section
        id: notice
        run: |
          version="${GITHUB_REF_NAME#v}"
          notice=""
          if grep -qxF "## Migrating to ${version}" README.md; then
            anchor="migrating-to-${version//./}"
            notice="**Breaking release.** Read [Migrating to ${version}](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#${anchor}) before you bump your pin."
          fi
          echo "notice=${notice}" >> "$GITHUB_OUTPUT"

      - name: Publish the release with the wheels the check admitted
        env:
          GH_TOKEN: ${{ github.token }}
          NOTICE: ${{ steps.notice.outputs.notice }}
        run: |
          notes=()
          if [ -n "$NOTICE" ]; then
            notes=(--notes "$NOTICE")
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl --title "$GITHUB_REF_NAME" --generate-notes "${notes[@]}"
