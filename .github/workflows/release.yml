name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false

      - name: Build the three distributions
        run: uv build --all-packages

      - name: The tag names the version all three wheels were built at
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(printf '%s\n' \
            "overnightworks_agent_runtime_client-${version}-py3-none-any.whl" \
            "overnightworks_agent_runtime-${version}-py3-none-any.whl" \
            "overnightworks_agent_runtime_service-${version}-py3-none-any.whl")"
          built="$(cd dist && ls -- *.whl | sort)"
          if [ "$built" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME expects exactly:" >&2
            echo "$expected" >&2
            echo "but the build produced:" >&2
            echo "$built" >&2
            exit 1
          fi

      - name: Point a breaking release at its migration section
        id: notice
        run: |
          version="${GITHUB_REF_NAME#v}"
          notice=""
          if grep -qxF "## Migrating to ${version}" docs/MIGRATING.md; then
            anchor="migrating-to-${version//./}"
            notice="**Breaking release.** Read [Migrating to ${version}](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/MIGRATING.md#${anchor}) before you bump your pin."
          fi
          echo "notice=${notice}" >> "$GITHUB_OUTPUT"

      - name: List the wheels with their hashes
        id: install
        run: |
          {
            echo 'install<<INSTALL_LINES'
            echo '**Install.** Pin each wheel by URL and hash.'
            echo
            echo '```'
            for wheel in dist/*.whl; do
              file="$(basename "$wheel")"
              name="${file%%-*}"
              hash="$(sha256sum "$wheel" | cut -d ' ' -f 1)"
              echo "${name//_/-} @ https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${file}#sha256=${hash}"
            done
            echo '```'
            echo 'INSTALL_LINES'
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release with the wheels the check admitted
        env:
          GH_TOKEN: ${{ github.token }}
          NOTICE: ${{ steps.notice.outputs.notice }}
          INSTALL: ${{ steps.install.outputs.install }}
        run: |
          notes="$INSTALL"
          if [ -n "$NOTICE" ]; then
            notes="${NOTICE}"$'\n\n'"${INSTALL}"
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes"
