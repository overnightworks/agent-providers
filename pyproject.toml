[project]
name = "overnightworks-agent-providers"
version = "0.1.0"
description = "Reusable agent provider layer: Claude, Grok and Codex routing, live catalogs, turn streams, tool loop, bounded process runner, status probes, and sandbox building blocks"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "anyio>=4,<5",
]

[project.optional-dependencies]
api = ["anthropic>=0.26,<2"]
image = ["pillow>=12.3,<13"]
dev = [
    "pytest>=7,<10",
    "ruff>=0.4,<1",
    "import-linter>=2,<3",
]

[project.urls]
Repository = "https://github.com/overnightworks/agent-providers"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_providers*"]

[tool.setuptools.package-data]
agent_providers = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["acceptance(identifier): exact Acceptance evidence claim."]
